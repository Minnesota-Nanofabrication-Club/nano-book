<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Nano Book — Under Construction</title>
<style>
  :root {
    --tape-yellow: #f2c200;
    --tape-black: #1a1a1a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    flex-direction: column;
    min-height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--tape-black);
    background: #fdfdf5;
  }
  .tape {
    flex: 0 0 auto;
    height: 46px;
    background: repeating-linear-gradient(
      -45deg,
      var(--tape-yellow) 0,
      var(--tape-yellow) 30px,
      var(--tape-black) 30px,
      var(--tape-black) 60px
    );
    box-shadow: 0 0 0 1px rgba(0,0,0,0.15) inset;
  }
  main {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2.5rem 1.5rem;
  }
  .card {
    max-width: 640px;
    width: 100%;
    text-align: center;
    background: #ffffff;
    border: 4px solid var(--tape-black);
    border-radius: 10px;
    padding: 2.5rem 2rem;
    box-shadow: 0 12px 32px rgba(0,0,0,0.12);
  }
  .sign {
    display: inline-block;
    padding: 0.35rem 1rem;
    margin-bottom: 1.25rem;
    background: var(--tape-yellow);
    border: 3px solid var(--tape-black);
    border-radius: 6px;
    font-weight: 800;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-size: 0.85rem;
  }
  h1 {
    margin: 0 0 0.75rem;
    font-size: clamp(1.6rem, 5vw, 2.4rem);
    line-height: 1.15;
  }
  p {
    margin: 0.4rem 0;
    font-size: 1.05rem;
    line-height: 1.55;
  }
  .muted { color: #555; font-size: 0.95rem; }
</style>
</head>
<body>
  <div class="tape" aria-hidden="true"></div>
  <main>
    <div class="card">
      <span class="sign">&#9888; Under Construction</span>
      <h1>The Nano Book is being built</h1>
      <p>This site is under construction. Please come back later.</p>
      <p class="muted">Minnesota Nanofabrication Club</p>
    </div>
  </main>
  <div class="tape" aria-hidden="true"></div>
</body>
</html>
