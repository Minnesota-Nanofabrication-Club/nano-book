[book]
title = "EDIT ME: e.g. Analog Tutorials"
authors = ["ASIC Network"]
language = "en"
src = "src"

[build]
create-missing = false

[output.html]
git-repository-url = "https://github.com/ASIC-Network/EDIT-ME-repo-name"
edit-url-template = "https://github.com/ASIC-Network/EDIT-ME-repo-name/edit/main/{path}"
additional-css = ["theme/asic-network.css"]
additional-js = ["theme/asic-network.js"]
site-url = "/EDIT-ME-repo-name/"
input-404 = "404.md"
default-theme = "light"
preferred-dark-theme = "light"

[output.html.playground]
copyable = true
editable = false
runnable = false

[output.html.search]
enable = true
limit-results = 20
use-boolean-and = true
