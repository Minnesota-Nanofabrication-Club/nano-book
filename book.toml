[book]
title = "Nano Book"
authors = ["UMN Nano Fab Club"]
language = "en"
src = "src"

[build]
create-missing = false

[output.html]
git-repository-url = "https://minnesota-nanofabrication-club.github.io/nano-book/"
edit-url-template = "https://minnesota-nanofabrication-club.github.io/nano-book/edit/main/{path}"
additional-css = ["theme/nanofab.css"]
additional-js = ["theme/nanofab.js"]
site-url = "/nano-book_staging/"
input-404 = "404.md"
default-theme = "light"
preferred-dark-theme = "light"

[output.html.fold]
enable = true
level = 0

[output.html.playground]
copyable = true
editable = false
runnable = false

[output.html.search]
enable = true
limit-results = 20
use-boolean-and = true

# Pages that moved when the machine pages were renamed to match the
# website (docsURL + "machines/<machine file name>.html").
[output.html.redirect]
"/sputterer/sputterer.html" = "../machines/sputterer.html"
"/stepper/stepper.html" = "../machines/maskless-stepper.html"
"/furnace/furnace.html" = "../machines/tube-furnace.html"
"/spin-coater/spin-coater.html" = "../machines/spinner.html"
"/cleanroom/cleanroom.html" = "../machines/cleanroom-microenvironment.html"
